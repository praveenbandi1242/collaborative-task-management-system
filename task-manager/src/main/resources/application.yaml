spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://taskmanager-postgres:5432/taskmanager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: change-this-secret-key-to-a-long-random-secret-key
  expiration: 86400000


server:
  port: 8080
